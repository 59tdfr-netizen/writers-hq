<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
<title id="title">Ренессансная мастерская писателя</title>
<desc id="desc">Тёплая живописная мастерская с раскрытой рукописью, пером, книгами и силуэтом Флоренции за аркой</desc>
<defs>
 <linearGradient id="wall" x2="1" y2="1"><stop stop-color="#211812"/><stop offset=".48" stop-color="#5b3823"/><stop offset="1" stop-color="#2d1c16"/></linearGradient>
 <linearGradient id="paper" x2=".1" y2="1"><stop stop-color="#f2d9a8"/><stop offset="1" stop-color="#b58a54"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#8d552d"/><stop offset="1" stop-color="#3a2117"/></linearGradient>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#c9b38a"/><stop offset=".58" stop-color="#8d9a88"/><stop offset="1" stop-color="#6b7460"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#f5d69a" stop-opacity=".8"/><stop offset="1" stop-color="#e6b86b" stop-opacity="0"/></radialGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .25 0 0 0 0 .16 0 0 0 0 .08 0 0 0 .12 0"/></filter>
