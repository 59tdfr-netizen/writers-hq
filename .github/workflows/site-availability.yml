name: Public site availability check

on:
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-availability
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published site and critical static assets
        env:
          SITE_URL: https://59tdfr-netizen.github.io/writers-hq/
        run: |
          set -euo pipefail
          html="$(mktemp)"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 30 "$SITE_URL" --output "$html"
          grep -q '<title>Штаб писателя' "$html"
          grep -q 'assets/favicon.svg' "$html"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --max-time 30 "${SITE_URL}assets/favicon.svg" --output /dev/null
          echo "Public site, title and favicon are reachable."
