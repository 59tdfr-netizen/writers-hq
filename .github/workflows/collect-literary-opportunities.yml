name: Update literary opportunities

on:
  push:
    branches:
      - main
    paths:
      - "scripts/collect_literary_opportunities.py"
      - "tests/**"
      - ".github/workflows/collect-literary-opportunities.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum source pages to scan (1–20)"
        required: false
        default: "8"
        type: string
      dry_run:
        description: "true = preview only; false = allow limited database inserts"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      max_live_inserts:
        description: "Maximum new records in a manual live run (1–10)"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  # Keep scheduled live collection separate from push-triggered dry runs.
  # A newer push may replace an older dry run that is taking too long.
  group: literary-opportunity-collector-${{ github.event_name == 'schedule' && 'schedule' || 'adhoc' }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Validate scraper syntax
        run: python -m py_compile scripts/collect_literary_opportunities.py

      - name: Run collector unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect open literary opportunities
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_MAX_PAGES: ${{ inputs.max_pages || '8' }}
          # Scheduled runs are live after the controlled insert test passed. Pushes stay dry-run; manual runs remain opt-in.
          SCRAPER_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run || 'true' }}
          SCRAPER_MAX_LIVE_INSERTS: ${{ inputs.max_live_inserts || '3' }}
          SCRAPER_MAX_DRY_RUN_DETAIL_CHECKS: '35'
        run: python scripts/collect_literary_opportunities.py
