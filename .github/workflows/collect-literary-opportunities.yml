name: Update literary opportunities

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum source pages to scan (1–20)"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: literary-opportunity-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3

      - name: Validate scraper syntax
        run: python -m py_compile scripts/collect_literary_opportunities.py

      - name: Run scraper unit tests
        run: python -m unittest discover -s tests -v

      - name: Collect open literary opportunities
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_MAX_PAGES: ${{ inputs.max_pages || '1' }}
          SCRAPER_DRY_RUN: "true"
        run: python scripts/collect_literary_opportunities.py
