
name: AI Design Plan

on:
  push:
    branches:
      - ai-agent-setup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare design plan with Cloudflare AI
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          import urllib.error
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter

          token = os.environ.get("CLOUDFLARE_AI_TOKEN", "")
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")

          if not token or not account_id:
              sys.exit("ERROR: Cloudflare GitHub Secrets are missing.")

          path = Path("index.html")
          if not path.is_file():
              sys.exit("ERROR: index.html was not found.")

          html = path.read_text(encoding="utf-8")

          class Analyzer(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.headings = []
                  self.buttons = []
                  self.sections = []
                  self.inputs = []
                  self.classes = Counter()
                  self.capture = None
                  self.depth = 0
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  for name in attrs.get("class", "").split():
                      self.classes[name] += 1

                  if tag == "section":
                      self.sections.append({
                          "id": attrs.get("id", ""),
                          "class": attrs.get("class", "")
                      })

                  if tag in ("input", "textarea", "select"):
                      self.inputs.append({
                          "tag": tag,
                          "type": attrs.get("type", ""),
                          "id": attrs.get("id", ""),
                          "placeholder": attrs.get("placeholder", "")
                      })

                  if tag in ("h1", "h2", "h3", "h4", "button"):
                      self.capture = tag
                      self.depth = 1
                      self.parts = []
                  elif self.capture:
                      self.depth += 1

              def handle_endtag(self, tag):
                  if not self.capture:
                      return

                  if tag == self.capture and self.depth == 1:
                      value = " ".join(" ".join(self.parts).split())
                      if value:
                          if self.capture == "button":
                              self.buttons.append(value[:100])
                          else:
                              self.headings.append({
                                  "tag": self.capture,
                                  "text": value[:120]
                              })
                      self.capture = None
                      self.depth = 0
                      self.parts = []
                  elif self.capture:
                      self.depth = max(1, self.depth - 1)

              def handle_data(self, data):
                  if self.capture and data.strip():
                      self.parts.append(data.strip())

          analyzer = Analyzer()
          analyzer.feed(html)

          css_blocks = re.findall(
              r"<style\b[^>]*>(.*?)</style\s*>",
              html,
              flags=re.I | re.S
          )
          css = "\n\n".join(css_blocks)

          variables = list(dict.fromkeys(re.findall(
              r"--[\w-]+\s*:\s*[^;}{]+;",
              css
          )))[:35]

          selectors = list(dict.fromkeys(
              s.strip() for s in re.findall(r"([^{}]+)\{", css)
              if s.strip()
              and len(s.strip()) < 100
              and not s.strip().startswith("@")
          ))[:55]

          summary = {
              "page_title": re.findall(
                  r"<title\b[^>]*>(.*?)</title\s*>",
                  html,
                  flags=re.I | re.S
              )[:1],
              "html_characters": len(html),
              "headings": analyzer.headings[:55],
              "buttons": analyzer.buttons[:45],
              "sections": analyzer.sections[:40],
              "inputs": analyzer.inputs[:35],
              "common_classes": analyzer.classes.most_common(35),
              "css_variables": variables,
              "css_selectors": selectors,
              "css_excerpt": css[:3000]
          }

          print("Starting design planning...")
          print(f"HTML size: {len(html)} characters")
          print(f"CSS blocks: {len(css_blocks)}")

          system_prompt = """
          Ты — опытный UX/UI-дизайнер и frontend-архитектор.
          Подготовь краткий, конкретный план редизайна существующего
          приложения «Штаб писателя» на основе переданного HTML/CSS.

          УТВЕРЖДЁННЫЙ СТИЛЬ:
          - Контрастная мастерская: тёмная боковая панель и верхняя
            зона, светлая рабочая область.
          - Угольный, пергаментный, бордовый, терракотовый,
            приглушённое золото.
          - Книжная антиква в заголовках, читаемый шрифт
            в полях, кнопках, календаре и статистике.
          - Умеренные отсылки к живописи и скульптуре Возрождения.
          - Сохранить функции, навигацию, авторизацию и данные.
          - Убрать большой приветственный заголовок в верхней зоне,
            подпись под логотипом и текстовую цитату в декоративной
            карточке справа. Изображение карточки можно сохранить.

          ПРАВИЛА:
          - Только план. Не изменяй файлы и не утверждай, что сайт
            проверен в браузере.
          - Используй только существующие селекторы из данных.
          - Отделяй факты от предположений.
          - Учитывай мобильную адаптацию и доступность.
          - Не предлагай переписывать приложение с нуля.
          - Не раскрывай внутренние рассуждения.
          - Отвечай по-русски.

          Формат ответа:
          1. Краткая стратегия.
          2. Таблица: элемент, изменение, что сохранить.
          3. Цвета и типографика.
          4. Существующие CSS-селекторы для изучения.
          5. Три безопасных этапа внедрения.
          6. Риски и проверки после изменений.

          Будь кратким и практичным. Если данных недостаточно,
          прямо укажи это.
          """

          user_prompt = (
              "Подготовь план редизайна. Ничего не изменяй.\n\n"
              + json.dumps(summary, ensure_ascii=False)
          )

          payload = {
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt}
              ],
              "max_tokens": 1800
          }

          url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account_id
              + "/ai/run/@cf/zai-org/glm-4.7-flash"
          )

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=240) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              print(f"Cloudflare API HTTP error: {error.code}")
              try:
                  print(error.read().decode("utf-8")[:1200])
              except Exception:
                  pass
              sys.exit("Design planning request failed.")
          except Exception as error:
              print(f"Request failed: {type(error).__name__}")
              sys.exit("Design planning request failed.")

          if not result.get("success", False):
              for item in result.get("errors", []):
                  print("API error:", item.get("message", "Unknown error"))
              sys.exit("Cloudflare reported an unsuccessful request.")

          choices = result.get("result", {}).get("choices", [])
          if not choices:
              sys.exit("The model returned no answer choices.")

          choice = choices[0]
          message = choice.get("message", {})
          report = message.get("content")

          print("Model:", result.get("result", {}).get("model", "unknown"))
          print("Finish reason:", choice.get("finish_reason"))

          if not isinstance(report, str) or not report.strip():
              sys.exit("The model returned an empty design plan.")

          print("\n" + "=" * 55)
          print("ПЛАН РЕДИЗАЙНА — ШТАБ ПИСАТЕЛЯ")
          print("=" * 55 + "\n")
          print(report)
          print("\nPlanning complete. No website files were modified.")
          PY
