
name: AI Design Plan

on:
  push:
    branches:
      - ai-agent-setup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare design plan with Cloudflare AI
        env:
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          import urllib.error
          from pathlib import Path
          from html.parser import HTMLParser
          from collections import Counter

          token = os.environ.get("CLOUDFLARE_AI_TOKEN", "")
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")

          if not token or not account_id:
              sys.exit("ERROR: Cloudflare GitHub Secrets are missing.")

          path = Path("index.html")
          if not path.is_file():
              sys.exit("ERROR: index.html was not found.")

          html = path.read_text(encoding="utf-8")

          class Analyzer(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.headings = []
                  self.buttons = []
                  self.sections = []
                  self.inputs = []
                  self.classes = Counter()
                  self.capture = None
                  self.depth = 0
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  for name in attrs.get("class", "").split():
                      self.classes[name] += 1

                  if tag == "section":
                      self.sections.append({
                          "id": attrs.get("id", ""),
                          "class": attrs.get("class", "")
                      })

                  if tag in ("input", "textarea", "select"):
                      self.inputs.append({
                          "tag": tag,
                          "type": attrs.get("type", ""),
                          "id": attrs.get("id", ""),
                          "placeholder": attrs.get("placeholder", "")
                      })

                  if tag in ("h1", "h2", "h3", "h4", "button"):
                      self.capture = tag
                      self.depth = 1
                      self.parts = []
                  elif self.capture:
                      self.depth += 1

              def handle_endtag(self, tag):
                  if not self.capture:
                      return

                  if tag == self.capture and self.depth == 1:
                      value = " ".join(" ".join(self.parts).split())
                      if value:
                          if self.capture == "button":
                              self.buttons.append(value[:100])
                          else:
                              self.headings.append({
                                  "tag": self.capture,
                                  "text": value[:120]
                              })
                      self.capture = None
                      self.depth = 0
                      self.parts = []
                  elif self.capture:
                      self.depth = max(1, self.depth - 1)

              def handle_data(self, data):
                  if self.capture and data.strip():
                      self.parts.append(data.strip())

          analyzer = Analyzer()
          analyzer.feed(html)

          css_blocks = re.findall(
              r"<style\b[^>]*>(.*?)</style\s*>",
              html,
              flags=re.I | re.S
          )
          css = "\n\n".join(css_blocks)

          variables = list(dict.fromkeys(re.findall(
              r"--[\w-]+\s*:\s*[^;}{]+;",
              css
          )))[:30]

          selectors = list(dict.fromkeys(
              item.strip()
              for item in re.findall(r"([^{}]+)\{", css)
              if item.strip()
              and len(item.strip()) < 100
              and not item.strip().startswith("@")
          ))[:45]

          summary = {
              "title": re.findall(
                  r"<title\b[^>]*>(.*?)</title\s*>",
                  html,
                  flags=re.I | re.S
              )[:1],
              "html_characters": len(html),
              "headings": analyzer.headings[:45],
              "buttons": analyzer.buttons[:35],
              "sections": analyzer.sections[:30],
              "inputs": analyzer.inputs[:25],
              "common_classes": analyzer.classes.most_common(30),
              "css_variables": variables,
              "css_selectors": selectors,
              "css_excerpt": css[:2200]
          }

          print("Starting design planning...")
          print(f"HTML size: {len(html)} characters")
          print(f"CSS blocks: {len(css_blocks)}")

          system_prompt = """
          Ты — UX/UI-дизайнер и frontend-архитектор.
          Подготовь практический план редизайна приложения
          «Штаб писателя» по переданному описанию HTML и CSS.

          УТВЕРЖДЁННЫЙ СТИЛЬ:
          - Контрастная мастерская: тёмная боковая панель
            и верхняя зона, светлая рабочая область.
          - Угольный, цвет старого пергамента, бордовый,
            терракотовый и приглушённое золото.
          - Книжная антиква в заголовках, простой читаемый
            шрифт в полях, кнопках и статистике.
          - Умеренные отсылки к живописи и скульптуре Возрождения.
          - Не перегружай интерфейс изображениями и декором.
          - Убрать большой приветственный заголовок в верхней
            зоне, подпись под логотипом и текстовую цитату
            в декоративной карточке справа. Изображение карточки
            можно сохранить.

          ОБЯЗАТЕЛЬНО:
          - Только план. Ничего не изменяй.
          - Не утверждай, что проверял сайт в браузере.
          - Используй только реально указанные селекторы.
          - Не предлагай переписывать приложение с нуля.
          - Сохраняй функции, навигацию, авторизацию и данные.
          - Отмечай предположения, которые надо проверить.
          - Учитывай мобильную адаптацию и доступность.
          - Не раскрывай внутренние рассуждения.
          - Пиши по-русски, коротко и конкретно.

          Выдай ровно пять разделов:
          1. Стратегия редизайна — до 4 предложений.
          2. Изменения интерфейса — 5 пунктов:
             элемент, предлагаемое изменение, что сохранить.
          3. Цвета и типографика — конкретные рекомендации.
          4. CSS — до 8 существующих подходящих селекторов
             и что проверить в каждом.
          5. Этапы внедрения и проверки — 3 этапа.

          Максимум 700 слов. Не добавляй вступление,
          заключение или повторяющееся описание задачи.
          Если данных недостаточно, скажи об этом кратко.
          """

          user_prompt = (
              "Подготовь план редизайна по этим данным.\n"
              "Это анализ, не изменение сайта.\n\n"
              + json.dumps(summary, ensure_ascii=False)
          )

          payload = {
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt}
              ],
              "max_tokens": 3000
          }

          url = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account_id
              + "/ai/run/@cf/zai-org/glm-4.7-flash"
          )

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=240) as response:
                  result = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              print(f"Cloudflare API HTTP error: {error.code}")
              try:
                  print(error.read().decode("utf-8")[:1200])
              except Exception:
                  pass
              sys.exit("Design planning request failed.")
          except Exception as error:
              print(f"Request failed: {type(error).__name__}")
              sys.exit("Design planning request failed.")

          if not result.get("success", False):
              for item in result.get("errors", []):
                  print("API error:", item.get("message", "Unknown error"))
              sys.exit("Cloudflare reported an unsuccessful request.")

          api_result = result.get("result", {})
          choices = api_result.get("choices", [])

          print("Model:", api_result.get("model", "unknown"))

          if not choices:
              sys.exit("The model returned no answer choices.")

          choice = choices[0]
          report = choice.get("message", {}).get("content")
          finish_reason = choice.get("finish_reason", "unknown")

          print("Finish reason:", finish_reason)

          if not isinstance(report, str) or not report.strip():
              sys.exit("The model returned an empty design plan.")

          if finish_reason == "length":
              print("The response was truncated by the model token limit.")
              sys.exit("Incomplete plan rejected. No website files were modified.")

          if finish_reason not in ("stop", None):
              sys.exit("The model did not confirm a normal response ending.")

          print("\n" + "=" * 55)
          print("ПЛАН РЕДИЗАЙНА — ШТАБ ПИСАТЕЛЯ")
          print("=" * 55 + "\n")
          print(report)
          print("\n" + "=" * 55)
          print("Planning complete. No website files were modified.")
          PY
