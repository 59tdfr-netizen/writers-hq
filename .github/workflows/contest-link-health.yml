name: Contest link health check

on:
  schedule:
    - cron: "31 8 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/check_contest_links.py"
      - ".github/workflows/contest-link-health.yml"

permissions:
  contents: read

concurrency:
  group: contest-link-health
  cancel-in-progress: true

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check bounded sample of upcoming contest links
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINK_CHECK_LIMIT: "25"
        run: python scripts/check_contest_links.py
