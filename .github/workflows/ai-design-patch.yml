
name: AI Design Patch Proposal

on:
  workflow_dispatch:
  push:
    branches:
      - ai-agent-setup
    paths:
      - ".github/workflows/ai-design-patch.yml"

permissions:
  contents: read

jobs:
  propose-design:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CSS proposal
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          from pathlib import Path

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("CLOUDFLARE_AI_TOKEN", "").strip()

          if not account or not token:
              sys.exit("ERROR: Cloudflare secrets are missing.")

          html_path = Path("index.html")
          if not html_path.is_file():
              sys.exit("ERROR: index.html was not found.")

          html = html_path.read_text(encoding="utf-8")

          css_parts = []

          for path in sorted(Path(".").rglob("*.css")):
              if any(
                  part in {".git", "node_modules", ".venv"}
                  for part in path.parts
              ):
                  continue
              css_parts.append(
                  f"\n/* {path.as_posix()} */\n"
                  + path.read_text(
                      encoding="utf-8",
                      errors="replace"
                  )
              )

          inline_css = re.findall(
              r"<style\b[^>]*>(.*?)</style\s*>",
              html,
              flags=re.I | re.S
          )

          for i, content in enumerate(inline_css, start=1):
              css_parts.append(f"\n/* Inline CSS {i} */\n{content}")

          current_css = "\n".join(css_parts)

          if not current_css.strip():
              sys.exit("ERROR: No existing CSS found.")

          headings = re.findall(
              r"<(h1|h2|h3)\b[^>]*>(.*?)</\1\s*>",
              html,
              flags=re.I | re.S
          )

          heading_text = []
          for tag, content in headings[:12]:
              text = re.sub(r"<[^>]+>", " ", content)
              text = re.sub(r"\s+", " ", text).strip()
              if text:
                  heading_text.append(f"{tag}: {text[:70]}")

          classes = sorted(set(
              cls
              for value in re.findall(
                  r'class=["\']([^"\']+)["\']',
                  html
              )
              for cls in value.split()
          ))

          context = {
              "page_headings": heading_text,
              "existing_classes": classes[:90],
              "existing_css": current_css[:6500],
              "html_excerpt": html[:1800]
          }

          system_prompt = """
          Ты профессиональный UX/UI-дизайнер приложения «Штаб писателя».

          Верни ТОЛЬКО CSS-код. Никакого JSON, Markdown, вступления,
          пояснений или заключения. Не используй блоки ```.

          Задача: предложить конкретное улучшение существующего дизайна.

          Направление «Контрастная мастерская»:
          - эстетика Возрождения без декоративной перегруженности;
          - угольный, бордовый, терракотовый и приглушённое золото;
          - светлая рабочая область и светлые карточки;
          - выразительные заголовки и удобочитаемый интерфейс;
          - аккуратные границы, состояния наведения и фокуса.

          Требования:
          1. Изучи существующие HTML и CSS.
          2. Выбери 2–4 действительно полезных изменения.
          3. Используй только подтверждённые классы, элементы и переменные.
          4. Не добавляй селекторы классов, которых нет во входных данных.
          5. Не делай весь интерфейс тёмным.
          6. Не меняй структуру сетки и расположение крупных блоков.
          7. Не скрывай элементы и не меняй функциональность.
          8. Не добавляй HTML, JavaScript, @import или URL.
          9. Не переписывай без необходимости уже существующие правила.
          10. Не выдумывай новые переменные CSS.
          11. Патч должен быть компактным: максимум 1200 символов.
          12. Верни только законченные CSS-правила с закрытыми скобками.
          13. Не утверждай, что проверял сайт в браузере.

          Если не удаётся обосновать изменение, выбери самое безопасное
          улучшение существующих карточек, кнопок или заголовков.
          """

          user_prompt = (
              "Создай компактный CSS-патч. "
              "Верни только CSS, не JSON.\n\n"
              + json.dumps(context, ensure_ascii=False)
          )

          endpoint = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account
              + "/ai/run/@cf/zai-org/glm-4.7-flash"
          )

          payload = {
              "messages": [
                  {
                      "role": "system",
                      "content": system_prompt
                  },
                  {
                      "role": "user",
                      "content": user_prompt
                  }
              ],
              "max_tokens": 1800,
              "temperature": 0.1,
              "chat_template_kwargs": {
                  "enable_thinking": False
              }
          }

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Requesting CSS-only proposal.")
          print("Website source files will not be modified.")

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              sys.exit(
                  f"ERROR: Cloudflare request failed: "
                  f"{type(exc).__name__}: {exc}"
              )

          if not data.get("success"):
              print(json.dumps(
                  data.get("errors", []),
                  ensure_ascii=False
              )[:1200])
              sys.exit("ERROR: Cloudflare returned an unsuccessful response.")

          result = data.get("result") or {}
          choices = result.get("choices") or []

          if not choices:
              sys.exit("ERROR: The model returned no choices.")

          choice = choices[0] or {}
          finish = choice.get("finish_reason")
          message = choice.get("message") or {}
          answer = message.get("content")

          if not isinstance(answer, str) or not answer.strip():
              if isinstance(result.get("response"), str):
                  answer = result["response"]
              else:
                  sys.exit("ERROR: The model returned no CSS text.")

          print("Finish reason:", finish)
          print("Response characters:", len(answer))
          print("Usage:", json.dumps(
              result.get("usage", {}),
              ensure_ascii=False
          )[:400])

          if finish == "length":
              sys.exit(
                  "ERROR: Model output was truncated. "
                  "No proposal was accepted."
              )

          patch = answer.strip()

          patch = re.sub(
              r"^```(?:css)?\s*",
              "",
              patch,
              flags=re.I
          )
          patch = re.sub(r"\s*```$", "", patch).strip()

          if not patch:
              sys.exit("ERROR: The CSS proposal is empty.")

          if len(patch) > 1800:
              sys.exit("ERROR: CSS proposal exceeds the size limit.")

          if not re.search(r"[^{}]+\{[^{}]+\}", patch):
              sys.exit("ERROR: No complete CSS rule was found.")

          if patch.count("{") != patch.count("}"):
              sys.exit("ERROR: CSS braces are unbalanced.")

          if re.search(
              r"<\s*/?\s*(?:script|html|body|iframe)\b"
              r"|javascript\s*:|expression\s*\(",
              patch,
              flags=re.I
          ):
              sys.exit("ERROR: Unsafe or unexpected content in CSS.")

          if re.search(
              r"@import\b|url\s*\(|behavior\s*:",
              patch,
              flags=re.I
          ):
              sys.exit("ERROR: Imports and external URLs are not allowed.")

          Path("design-proposal.css").write_text(
              "/* AI proposal only. Not applied to the website. */\n\n"
              + patch + "\n",
              encoding="utf-8"
          )

          report = """# Предложение по дизайну «Штаба писателя»

          > Предложение не применено к сайту.
          > Проверка в браузере не выполнялась.
          > Исходные файлы сайта не изменялись.

          ## Результат

          Получен CSS-патч от модели Cloudflare AI.
          Проверены наличие CSS-правил, баланс фигурных скобок
          и отсутствие некоторых небезопасных конструкций.

          ## Важно

          Автоматическая проверка не подтверждает визуальную
          корректность, доступность или адаптивность патча.
          Перед применением необходимо проверить каждый селектор
          и оценить результат в браузере.

          ## CSS

          Полный патч находится в файле design-proposal.css.
          """

          Path("design-review-report.md").write_text(
              report,
              encoding="utf-8"
          )

          print("CSS proposal generated and basic checks passed.")
          print("Website source files were not modified.")
          PY

      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: writers-hq-design-review
          path: |
            design-proposal.css
            design-review-report.md
          if-no-files-found: error
          retention-days: 7
