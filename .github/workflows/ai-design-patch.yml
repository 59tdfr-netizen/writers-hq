
name: AI Design Patch Proposal

on:
  workflow_dispatch:
  push:
    branches:
      - ai-agent-setup
    paths:
      - ".github/workflows/ai-design-patch.yml"

permissions:
  contents: read

jobs:
  propose-design:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate compact CSS proposal
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          from pathlib import Path

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("CLOUDFLARE_AI_TOKEN", "").strip()

          if not account or not token:
              sys.exit("ERROR: Cloudflare secrets are missing.")

          html = Path("index.html").read_text(encoding="utf-8")

          styles = re.findall(
              r"<style\b[^>]*>(.*?)</style\s*>",
              html,
              flags=re.I | re.S
          )

          if not styles:
              sys.exit("ERROR: No inline CSS was found in index.html.")

          css = "\n".join(styles)

          classes = sorted(set(
              name
              for value in re.findall(
                  r'class=["\']([^"\']+)["\']',
                  html
              )
              for name in value.split()
              if re.fullmatch(r"[a-zA-Z_][a-zA-Z0-9_-]*", name)
          ))

          wanted = (
              "body", ":root", ".top", ".wrap", ".eyebrow",
              "h1", ".sub", ".card", ".card-head", ".btn",
              ".primary", ".secondary", ".stat", ".date-chip",
              "input", "select", "label"
          )

          rules = []
          for match in re.finditer(r"([^{}]+)\{([^{}]*)\}", css):
              selector = re.sub(r"\s+", " ", match.group(1)).strip()
              declarations = re.sub(
                  r"\s+", " ", match.group(2)
              ).strip()

              if not selector or not declarations:
                  continue

              if any(term in selector for term in wanted):
                  rules.append(f"{selector} {{{declarations}}}")

          existing_rules = "\n".join(rules)[:3000]

          if not existing_rules:
              sys.exit("ERROR: Could not extract relevant CSS rules.")

          context = {
              "existing_classes": classes[:65],
              "relevant_css": existing_rules
          }

          system_prompt = """
          You are a senior UI designer for a Russian writing app.
          Return CSS code only. No Markdown, JSON, comments or explanations.

          Design direction: "Contrast Workshop" — restrained Renaissance
          atmosphere, charcoal and burgundy accents, terracotta, muted gold,
          warm paper, elegant headings, readable interface.
          Keep the workspace and cards light. Avoid visual clutter.

          Propose at most 3 small, useful visual improvements to existing
          elements. Use only selectors and CSS variables confirmed in the
          supplied context. Prefer hover, focus, spacing, borders or subtle
          accents. Do not redesign the whole page or change its layout.
          Do not hide elements. Do not use URLs, imports or new fonts.
          Do not repeat unchanged CSS rules.

          Output no more than 450 characters of valid, complete CSS.
          Return only CSS rules with balanced braces.
          """

          user_prompt = (
              "Create a very small CSS patch from this context:\n"
              + json.dumps(context, ensure_ascii=False)
          )

          endpoint = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account
              + "/ai/run/@cf/zai-org/glm-4.7-flash"
          )

          payload = {
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt}
              ],
              "max_tokens": 900,
              "temperature": 0.1,
              "chat_template_kwargs": {
                  "enable_thinking": False
              }
          }

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Requesting a small CSS-only proposal.")
          print("Original website files will not be modified.")

          try:
              with urllib.request.urlopen(request, timeout=150) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              sys.exit(
                  f"ERROR: Cloudflare request failed: "
                  f"{type(exc).__name__}: {exc}"
              )

          if not data.get("success"):
              print(json.dumps(
                  data.get("errors", []),
                  ensure_ascii=False
              )[:1000])
              sys.exit("ERROR: Cloudflare API returned failure.")

          result = data.get("result") or {}
          choices = result.get("choices") or []

          answer = ""
          finish = None

          if choices:
              choice = choices[0] or {}
              finish = choice.get("finish_reason")
              message = choice.get("message") or {}
              content = message.get("content")

              if isinstance(content, str):
                  answer = content.strip()

          if not answer and isinstance(result.get("response"), str):
              answer = result["response"].strip()

          print("Finish reason:", finish)
          print("Response characters:", len(answer))
          print("Usage:", json.dumps(
              result.get("usage", {}),
              ensure_ascii=False
          )[:350])

          if finish == "length":
              sys.exit(
                  "ERROR: Model output was truncated. "
                  "No CSS proposal was accepted."
              )

          answer = re.sub(
              r"^```(?:css)?\s*",
              "",
              answer,
              flags=re.I
          )
          answer = re.sub(r"\s*```$", "", answer).strip()

          if not answer:
              sys.exit("ERROR: The model returned empty CSS.")

          if len(answer) > 700:
              sys.exit("ERROR: CSS proposal is longer than allowed.")

          if answer.count("{") != answer.count("}"):
              sys.exit("ERROR: CSS braces are unbalanced.")

          if not re.search(r"[^{}]+\{[^{}]+\}", answer):
              sys.exit("ERROR: No complete CSS rule was found.")

          if re.search(
              r"<|>|javascript\s*:|expression\s*\(|@import\b|url\s*\(",
              answer,
              flags=re.I
          ):
              sys.exit("ERROR: Unsafe or unexpected CSS content.")

          Path("design-proposal.css").write_text(
              "/* AI proposal only. Not applied to the website. */\n\n"
              + answer + "\n",
              encoding="utf-8"
          )

          Path("design-review-report.md").write_text(
              "# Предложение по дизайну «Штаба писателя»\n\n"
              "> Патч не применён к сайту.\n"
              "> Проверка в браузере не выполнялась.\n"
              "> Исходные файлы не изменялись.\n\n"
              "## Результат\n\n"
              "Получен компактный CSS-патч. Проверены длина, "
              "наличие CSS-правил и баланс фигурных скобок. "
              "Это не заменяет ручную проверку селекторов "
              "и визуального результата.\n",
              encoding="utf-8"
          )

          print("CSS proposal generated.")
          print("Website source files were not modified.")
          PY

      - name: Upload proposal
        uses: actions/upload-artifact@v4
        with:
          name: writers-hq-design-review
          path: |
            design-proposal.css
            design-review-report.md
          if-no-files-found: error
          retention-days: 7
