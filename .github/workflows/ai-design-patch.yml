
name: AI Design Patch Proposal

on:
  workflow_dispatch:
  push:
    branches:
      - ai-agent-setup
    paths:
      - ".github/workflows/ai-design-patch.yml"

permissions:
  contents: read

jobs:
  propose-design:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze website and prepare proposals
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          from pathlib import Path
          from html.parser import HTMLParser

          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("CLOUDFLARE_AI_TOKEN", "").strip()

          if not account_id or not token:
              sys.exit("ERROR: Cloudflare GitHub Secrets are missing.")

          html_path = Path("index.html")
          if not html_path.is_file():
              sys.exit("ERROR: index.html was not found.")

          html = html_path.read_text(encoding="utf-8")

          class WebsiteAnalyzer(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.headings = []
                  self.buttons = []
                  self.inputs = []
                  self.sections = []
                  self.classes = {}
                  self.ids = []
                  self.labels = []
                  self.current = None
                  self.depth = 0
                  self.parts = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  element_id = attrs.get("id")
                  if element_id:
                      self.ids.append(element_id)

                  for cls in attrs.get("class", "").split():
                      self.classes[cls] = self.classes.get(cls, 0) + 1

                  if tag == "section":
                      self.sections.append({
                          "id": element_id or "",
                          "class": attrs.get("class", "")
                      })

                  if tag in ("input", "textarea", "select"):
                      self.inputs.append({
                          "tag": tag,
                          "type": attrs.get("type", ""),
                          "id": element_id or "",
                          "name": attrs.get("name", ""),
                          "placeholder": attrs.get("placeholder", ""),
                          "aria_label": attrs.get("aria-label", "")
                      })

                  if tag == "label":
                      self.labels.append({
                          "for": attrs.get("for", "")
                      })

                  if tag in ("h1", "h2", "h3", "h4", "button"):
                      self.current = tag
                      self.depth = 1
                      self.parts = []
                  elif self.current:
                      self.depth += 1

              def handle_endtag(self, tag):
                  if not self.current:
                      return

                  if tag == self.current and self.depth == 1:
                      value = " ".join(" ".join(self.parts).split())
                      if value:
                          item = {"tag": self.current, "text": value[:140]}
                          if self.current == "button":
                              self.buttons.append(value[:100])
                          else:
                              self.headings.append(item)

                      self.current = None
                      self.depth = 0
                      self.parts = []
                  else:
                      self.depth = max(1, self.depth - 1)

              def handle_data(self, data):
                  if self.current and data.strip():
                      self.parts.append(data.strip())

          analyzer = WebsiteAnalyzer()
          analyzer.feed(html)

          css_parts = []

          for path in sorted(Path(".").rglob("*.css")):
              if any(part in (".git", "node_modules", ".venv")
                     for part in path.parts):
                  continue
              css_parts.append(
                  f"\n/* FILE: {path.as_posix()} */\n"
                  + path.read_text(encoding="utf-8", errors="replace")
              )

          inline_css = re.findall(
              r"<style\b[^>]*>(.*?)</style\s*>",
              html,
              flags=re.I | re.S
          )

          for index, css in enumerate(inline_css, start=1):
              css_parts.append(
                  f"\n/* INLINE STYLE BLOCK {index} */\n{css}"
              )

          css_text = "\n".join(css_parts)

          if not css_text.strip():
              sys.exit("ERROR: No CSS found. No proposal was generated.")

          summary = {
              "page_title": re.findall(
                  r"<title\b[^>]*>(.*?)</title\s*>",
                  html,
                  flags=re.I | re.S
              )[:1],
              "html_characters": len(html),
              "headings": analyzer.headings[:70],
              "buttons": analyzer.buttons[:60],
              "sections": analyzer.sections[:40],
              "inputs": analyzer.inputs[:60],
              "labels": analyzer.labels[:60],
              "common_classes": sorted(
                  analyzer.classes.items(),
                  key=lambda item: item[1],
                  reverse=True
              )[:50],
              "ids": analyzer.ids[:100],
              "html_excerpt": html[:9000],
              "css": css_text[:18000]
          }

          system_prompt = r"""
          Ты — UX/UI-дизайнер и frontend-архитектор проекта
          «Штаб писателя». Работай по-русски, конкретно и осторожно.

          ЦЕЛЬ
          Подготовить проверяемое предложение редизайна на основе реального
          HTML и CSS. Ничего не применять к сайту автоматически.

          УТВЕРЖДЁННОЕ НАПРАВЛЕНИЕ
          - Стиль: «Контрастная мастерская».
          - Тёмная боковая панель и верхняя зона, светлая рабочая область.
          - Угольный, цвет старого пергамента, бордовый, терракотовый
            и приглушённое золото.
          - Книжная антиква в заголовках, читаемый шрифт интерфейса
            в кнопках, полях и статистике.
          - Умеренные отсылки к живописи и скульптуре Возрождения.
          - Не перегружать интерфейс декором.

          ПРЕДЫДУЩИЕ НАБЛЮДЕНИЯ, КОТОРЫЕ НУЖНО СОХРАНИТЬ
          1. Не менять глобальную переменную --bg вслепую: сначала понять,
             какие части интерфейса от неё зависят.
          2. Не скрывать .sub целиком без проверки его реального содержимого.
          3. Georgia — лишь предварительный вариант антиквы, не обязательный
             окончательный выбор. Не подключать внешние шрифтовые сервисы.
          4. Проверить переполнение карточек, длинный текст и узкие экраны.
          5. Проверить доступность: контраст, подписи полей, видимый фокус,
             понятность элементов управления.
          6. Подтверждение перед опасными действиями — отдельная задача
             поведения приложения, не косметическое CSS-изменение.
          7. Развитие разделов «Авторы» и сообщества — отдельная задача
             функциональности.
          8. Визуализация книжного проекта и активности — возможные
             улучшения интерфейса, не повод переписывать приложение.

          ЕЩЁ НЕОБХОДИМО УЧЕСТЬ
          - Ранее был предложен отказ от большого приветственного заголовка,
            подписи под логотипом и текстовой цитаты в декоративной карточке.
            Изображение этой карточки можно сохранить.
          - Не удаляй и не скрывай эти элементы через CSS-патч.
            Укажи их в отчёте как отдельные кандидаты на согласованное
            изменение HTML после проверки точных элементов.
          - Предыдущий план называл селекторы .top, .sub, .card,
            .card-head, .card h2, .stat, .value, .label, :root, body,
            .wrap, h1, .eyebrow и .btn. Используй их только если они
            действительно присутствуют в переданном коде.
          - Нельзя утверждать, что сайт проверен в браузере.
            Анализируй только предоставленный исходный код.

          ОБЯЗАТЕЛЬНЫЕ ОГРАНИЧЕНИЯ
          - Сохраняй существующие функции, навигацию, авторизацию и данные.
          - Не переписывай приложение и не предлагай менять JavaScript.
          - Не удаляй элементы управления и не меняй структуру HTML.
          - CSS-патч должен содержать только консервативные CSS-переопределения.
          - Не используй внешние изображения, шрифты, платные API или сервисы.
          - Не выдумывай селекторы, содержимое элементов или подтверждённые
            дефекты. Отделяй найденное в коде от предположений.
          - Сохраняй адаптивность и видимый фокус клавиатуры.
          - Не обещай, что один CSS-патч исправит функциональные проблемы.
          - Если не уверен в безопасности изменения, не включай его в патч.

          ФОРМАТ ОТВЕТА
          Верни строго один JSON-объект, без Markdown-ограждений и вступления.
          Используй ровно эти ключи:
          {
            "css_patch": "строка с CSS",
            "confirmed_findings": [
              {"finding": "наблюдение", "evidence": "что в исходном коде это подтверждает"}
            ],
            "needs_verification": [
              {"check": "что проверить", "reason": "почему это пока не доказано"}
            ],
            "accessibility_responsiveness": [
              {"item": "проверка", "status": "найдено в коде или требует проверки", "next_step": "безопасное действие"}
            ],
            "functional_roadmap": [
              {"item": "задача", "reason": "зачем", "css_scope": "не относится к CSS-патчу"}
            ],
            "html_candidates": [
              {"element_description": "кандидат на изменение", "selector": "только если подтверждён исходным кодом", "caution": "что проверить до изменения"}
            ],
            "implementation_stages": [
              {"stage": "этап", "action": "действие", "validation": "как проверить"}
            ]
          }

          В css_patch верни только CSS-код внутри JSON-строки.
          Если нет надёжных оснований для изменения, верни пустую строку.
          Не заявляй о проблеме доступности или переполнении без доказательств.
          """

          user_prompt = (
              "Проанализируй исходный код и подготовь оба результата. "
              "CSS-патч и отчёт должны быть согласованы между собой.\n\n"
              + json.dumps(summary, ensure_ascii=False)
          )

          endpoint = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account_id
              + "/ai/run/@cf/zai-org/glm-4.7-flash"
          )

          payload = {
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": user_prompt}
              ],
              "max_tokens": 5000,
              "temperature": 0.1
          }

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  api_result = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              sys.exit(
                  "ERROR: Cloudflare AI request failed. "
                  "No website files were modified. "
                  + str(exc)
              )

          if not api_result.get("success"):
              sys.exit(
                  "ERROR: Cloudflare AI returned an unsuccessful response: "
                  + json.dumps(api_result.get("errors", []), ensure_ascii=False)
              )

          model_result = api_result.get("result") or {}
          answer = model_result.get("response", "")

          if not isinstance(answer, str) or not answer.strip():
              sys.exit("ERROR: The model returned an empty response.")

          answer = answer.strip()
          answer = re.sub(
              r"^```(?:json)?\s*",
              "",
              answer,
              flags=re.I
          )
          answer = re.sub(r"\s*```$", "", answer).strip()

          try:
              report = json.loads(answer)
          except json.JSONDecodeError as exc:
              sys.exit(
                  "ERROR: The model did not return valid JSON. "
                  "No proposal was accepted. Details: " + str(exc)
              )

          required_keys = {
              "css_patch",
              "confirmed_findings",
              "needs_verification",
              "accessibility_responsiveness",
              "functional_roadmap",
              "html_candidates",
              "implementation_stages"
          }

          if not required_keys.issubset(report):
              sys.exit("ERROR: The model response is missing required sections.")

          css = report.get("css_patch", "")
          if not isinstance(css, str):
              sys.exit("ERROR: css_patch must be a string.")

          css = css.strip()

          if re.search(
              r"<\s*/?\s*(?:script|html|body|iframe)\b"
              r"|javascript\s*:",
              css,
              flags=re.I
          ):
              sys.exit(
                  "ERROR: The CSS proposal contains unexpected markup. "
                  "It was rejected."
              )

          if re.search(r"@import\b|url\s*\(", css, flags=re.I):
              sys.exit(
                  "ERROR: External imports or CSS URLs are not allowed "
                  "in this proposal."
              )

          Path("design-proposal.css").write_text(
              "/* AI PROPOSAL ONLY. Not applied to the website. */\n\n"
              + (css + "\n" if css else "/* No safe CSS changes proposed. */\n"),
              encoding="utf-8"
          )

          sections = [
              ("Наблюдения, подтверждённые исходным кодом",
               "confirmed_findings"),
              ("Что ещё нужно проверить",
               "needs_verification"),
              ("Доступность и адаптивность",
               "accessibility_responsiveness"),
              ("Функциональные задачи вне CSS",
               "functional_roadmap"),
              ("Кандидаты на отдельные изменения HTML",
               "html_candidates"),
              ("Этапы внедрения и проверки",
               "implementation_stages")
          ]

          lines = [
              "# Предложение по развитию дизайна «Штаба писателя»",
              "",
              "> Это отчёт AI по исходному коду, а не результат проверки "
              "сайта в браузере. Ничего из предложенного не применено.",
              "",
              "## Принципы, которые сохраняем",
              "",
              "- Контрастная мастерская: тёмная боковая панель и верхняя зона, "
              "светлая рабочая область.",
              "- Палитра старого пергамента, угольного, бордового, "
              "терракотового и приглушённого золота.",
              "- Книжная антиква в заголовках и читаемый шрифт интерфейса.",
              "- Существующие функции, навигация, авторизация и данные.",
              "- Безопасность: никакого автоматического изменения исходного сайта.",
              ""
          ]

          def render_value(value):
              if isinstance(value, dict):
                  return "\n".join(
                      f"- **{key}:** {val}"
                      for key, val in value.items()
                  )
              if isinstance(value, list):
                  if not value:
                      return "- Нет записей."
                  output = []
                  for item in value:
                      if isinstance(item, dict):
                          output.append("- " + "; ".join(
                              f"**{key}:** {val}"
                              for key, val in item.items()
                          ))
                      else:
                          output.append(f"- {item}")
                  return "\n".join(output)
              return str(value)

          for title, key in sections:
              lines.extend(["## " + title, "", render_value(report.get(key, [])), ""])

          lines.extend([
              "## Как обращаться с CSS-патчем",
              "",
              "Файл `design-proposal.css` — только черновик. "
              "Перед применением проверьте селекторы и влияние правил "
              "на существующие компоненты. Не вставляйте патч вслепую.",
              "",
              "## Ограничения проверки",
              "",
              "- Отчёт построен по доступному HTML и CSS.",
              "- Визуальная проверка в браузере не выполнялась.",
              "- Предположения требуют ручной проверки.",
              "- Функциональные улучшения не входят в CSS-патч.",
              ""
          ])

          Path("design-review-report.md").write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print("Design proposal generated.")
          print(f"CSS proposal: {len(css)} characters.")
          print("Report: design-review-report.md")
          print("Original website files were not modified.")
          PY

      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: writers-hq-design-review
          path: |
            design-proposal.css
            design-review-report.md
          if-no-files-found: error
          retention-days: 7
