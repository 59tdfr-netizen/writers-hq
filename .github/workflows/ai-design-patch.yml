
name: AI Design Patch Proposal

on:
  workflow_dispatch:
  push:
    branches:
      - ai-agent-setup
    paths:
      - ".github/workflows/ai-design-patch.yml"

permissions:
  contents: read

jobs:
  propose-design:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate design proposal
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          from pathlib import Path

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("CLOUDFLARE_AI_TOKEN", "").strip()

          if not account or not token:
              sys.exit("ERROR: Cloudflare GitHub Secrets are missing.")

          html_path = Path("index.html")
          if not html_path.exists():
              sys.exit("ERROR: index.html was not found.")

          html = html_path.read_text(encoding="utf-8")

          css_parts = []
          for path in sorted(Path(".").rglob("*.css")):
              if any(part in {".git", "node_modules", ".venv"}
                     for part in path.parts):
                  continue
              css_parts.append(
                  f"\n/* {path.as_posix()} */\n"
                  + path.read_text(encoding="utf-8", errors="replace")
              )

          inline_css = re.findall(
              r"<style\b[^>]*>(.*?)</style\s*>",
              html,
              flags=re.I | re.S
          )
          for i, content in enumerate(inline_css, start=1):
              css_parts.append(f"\n/* Inline CSS {i} */\n{content}")

          css = "\n".join(css_parts)
          if not css.strip():
              sys.exit("ERROR: No CSS was found.")

          headings = re.findall(
              r"<(h1|h2|h3)\b[^>]*>(.*?)</\1\s*>",
              html,
              flags=re.I | re.S
          )
          headings = [
              {
                  "tag": tag.lower(),
                  "text": re.sub(
                      r"\s+", " ",
                      re.sub(r"<[^>]+>", " ", content)
                  ).strip()[:80]
              }
              for tag, content in headings[:15]
          ]

          classes = sorted(set(re.findall(
              r'class=["\']([^"\']+)["\']', html
          )))
          ids = sorted(set(re.findall(
              r'\bid=["\']([^"\']+)["\']', html
          )))

          context = {
              "headings": headings,
              "classes": classes[:45],
              "ids": ids[:45],
              "html_excerpt": html[:1400],
              "css_excerpt": css[:3000]
          }

          system_prompt = """
          Ты UX/UI-дизайнер проекта «Штаб писателя». Отвечай по-русски.
          Предложи осторожный редизайн «Контрастная мастерская»:
          тёмная боковая панель и верхняя зона, светлая рабочая область,
          старый пергамент, угольный, бордовый, терракотовый и приглушённое
          золото. Заголовки — выразительная антиква, интерфейс — читаемый
          системный шрифт. Эстетика Возрождения умеренная.

          Ограничения:
          - Не меняй исходный сайт, HTML, JavaScript, функции или данные.
          - Не скрывай и не удаляй элементы.
          - Используй только селекторы, подтверждённые предоставленным кодом.
          - Не используй внешние шрифты, URL, импорты или платные сервисы.
          - Не меняй --bg вслепую.
          - Не скрывай .sub, не проверив его содержимое.
          - Проверь контраст, клавиатурный фокус, поля и адаптивность.
          - Длинный приветственный заголовок, подпись под логотипом и цитата
            — только кандидаты на отдельное согласование, не CSS-скрытие.
          - Подтверждение опасных действий и развитие сообщества — задачи
            функциональности, не CSS.
          - Проверка в браузере не выполнялась.
          - Если безопасного CSS-изменения нет, css_patch должен быть "".

          Верни только JSON, без Markdown, с ключами:
          css_patch, confirmed_findings, needs_verification,
          accessibility_responsiveness, functional_roadmap,
          html_candidates, implementation_stages.
          css_patch — строка CSS. Остальные поля — списки максимум из
          двух коротких пунктов каждый. Не выдумывай подтверждённые дефекты.
          """

          endpoint = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account
              + "/ai/run/@cf/zai-org/glm-4.7-flash"
          )

          def extract_text(data):
              result = data.get("result") or {}
              if not isinstance(result, dict):
                  return "", None

              response = result.get("response")
              if isinstance(response, str) and response.strip():
                  return response.strip(), None

              choices = result.get("choices") or []
              if not choices:
                  return "", None

              choice = choices[0] or {}
              message = choice.get("message") or {}
              finish = choice.get("finish_reason")

              content = message.get("content")
              if isinstance(content, str) and content.strip():
                  return content.strip(), finish

              if isinstance(content, list):
                  pieces = [
                      item["text"]
                      for item in content
                      if isinstance(item, dict)
                      and isinstance(item.get("text"), str)
                  ]
                  if pieces:
                      return "\n".join(pieces).strip(), finish

              # Diagnostic fallback: some responses expose text under
              # reasoning_content even when content is null.
              for key in ("reasoning_content", "reasoning"):
                  value = message.get(key)
                  if isinstance(value, str) and value.strip():
                      print(f"Using fallback response field: {key}")
                      return value.strip(), finish

              print("Response keys:", list(result.keys()))
              print("Choice keys:", list(choice.keys()))
              print("Message keys:", list(message.keys()))
              print("Content type:", type(content).__name__)
              print("Finish reason:", finish)
              print("Stop reason:", choice.get("stop_reason"))
              return "", finish

          prompt = (
              "Проанализируй код и подготовь компактное предложение. "
              "Верни только JSON по заданной схеме. "
              "Не более двух пунктов в каждом списке.\n\n"
              + json.dumps(context, ensure_ascii=False)
          )

          payload = {
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": prompt}
              ],
              "max_tokens": 1400,
              "temperature": 0.1,
              "chat_template_kwargs": {
                  "enable_thinking": False
              }
          }

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Requesting compact design proposal.")
          print("Thinking mode disabled.")
          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  data = json.loads(response.read().decode("utf-8"))
          except Exception as exc:
              print(f"Request failed: {type(exc).__name__}: {exc}")
              if hasattr(exc, "read"):
                  try:
                      print(exc.read().decode("utf-8", errors="replace")[:1000])
                  except Exception:
                      pass
              sys.exit("ERROR: Cloudflare request failed.")

          if not data.get("success"):
              print(json.dumps(data.get("errors", []), ensure_ascii=False)[:1500])
              sys.exit("ERROR: Cloudflare returned an unsuccessful response.")

          answer, finish = extract_text(data)
          print("Extracted text characters:", len(answer))
          print("Finish reason:", finish)
          print("Usage:", json.dumps(
              (data.get("result") or {}).get("usage", {}),
              ensure_ascii=False
          )[:500])

          if not answer:
              sys.exit(
                  "ERROR: No readable model text. "
                  "Website files were not modified."
              )

          answer = re.sub(
              r"^```(?:json)?\s*", "", answer.strip(), flags=re.I
          )
          answer = re.sub(r"\s*```$", "", answer).strip()

          try:
              report = json.loads(answer)
          except json.JSONDecodeError as exc:
              print("Output preview:", answer[:1200])
              sys.exit(f"ERROR: Invalid JSON: {exc}")

          required = [
              "css_patch",
              "confirmed_findings",
              "needs_verification",
              "accessibility_responsiveness",
              "functional_roadmap",
              "html_candidates",
              "implementation_stages"
          ]

          missing = [key for key in required if key not in report]
          if missing:
              sys.exit("ERROR: Missing fields: " + ", ".join(missing))

          patch = report["css_patch"]
          if not isinstance(patch, str):
              sys.exit("ERROR: css_patch must be a string.")

          if re.search(
              r"<\s*/?\s*(?:script|html|body|iframe)\b|javascript\s*:",
              patch,
              flags=re.I
          ):
              sys.exit("ERROR: Unexpected markup in CSS proposal.")

          if re.search(r"@import\b|url\s*\(", patch, flags=re.I):
              sys.exit("ERROR: CSS imports and URLs are not allowed.")

          Path("design-proposal.css").write_text(
              "/* AI proposal only. Not applied to the website. */\n\n"
              + (patch.strip() + "\n" if patch.strip()
                 else "/* No safe CSS changes proposed. */\n"),
              encoding="utf-8"
          )

          section_titles = {
              "confirmed_findings": "Подтверждённые наблюдения",
              "needs_verification": "Что проверить вручную",
              "accessibility_responsiveness": "Доступность и адаптивность",
              "functional_roadmap": "Функциональные задачи вне CSS",
              "html_candidates": "Кандидаты на изменение HTML",
              "implementation_stages": "Следующие шаги"
          }

          lines = [
              "# Предложение по дизайну «Штаба писателя»",
              "",
              "> Проверка в браузере не выполнялась.",
              "> Исходные файлы сайта не изменялись.",
              ""
          ]

          for key, title in section_titles.items():
              lines.extend(["## " + title, ""])
              items = report.get(key, [])
              if not isinstance(items, list) or not items:
                  lines.extend(["- Нет записей.", ""])
                  continue
              for item in items[:2]:
                  lines.append("- " + str(item))
              lines.append("")

          lines.extend([
              "## Важно",
              "",
              "CSS-патч — предложение, а не внесённое изменение.",
              "Функциональные задачи не входят в CSS-патч.",
              ""
          ])

          Path("design-review-report.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )

          print("Proposal generated successfully.")
          print("Website source files were not modified.")
          PY

      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: writers-hq-design-review
          path: |
            design-proposal.css
            design-review-report.md
          if-no-files-found: error
          retention-days: 7
