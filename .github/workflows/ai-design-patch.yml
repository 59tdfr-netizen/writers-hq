
name: AI Design Patch Proposal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and validate CSS proposal
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          import urllib.error
          from pathlib import Path

          out = Path("design-output")
          out.mkdir(exist_ok=True)

          css_path = out / "design-proposal.css"
          report_path = out / "design-review-report.md"
          debug_path = out / "ai-response-diagnostics.txt"

          def fail(message):
              report_path.write_text(
                  "# Предложение по дизайну\n\n"
                  "**Статус: предложение не создано.**\n\n"
                  + message
                  + "\n\nИсходные файлы сайта не изменялись.\n",
                  encoding="utf-8"
              )
              print("ERROR: " + message)
              sys.exit(1)

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          token = os.environ.get("CLOUDFLARE_AI_TOKEN", "")

          if not account or not token:
              fail("Не найдены необходимые секреты Cloudflare.")

          index_path = Path("index.html")
          if not index_path.exists():
              fail("В корне репозитория не найден index.html.")

          html = index_path.read_text(encoding="utf-8")

          style_blocks = re.findall(
              r"<style\b[^>]*>(.*?)</style\s*>",
              html,
              flags=re.I | re.S
          )
          current_css = "\n\n".join(style_blocks)

          if not current_css.strip():
              fail(
                  "Не удалось найти CSS внутри style-блоков. "
                  "Внешние CSS-файлы требуют отдельного анализа."
              )

          classes = sorted(set(re.findall(
              r'class\s*=\s*["\']([^"\']*)["\']',
              html,
              flags=re.I
          )))
          headings = re.findall(
              r"<h[1-6]\b[^>]*>(.*?)</h[1-6]\s*>",
              html,
              flags=re.I | re.S
          )
          headings = [
              re.sub(r"<[^>]+>", " ", h).strip()
              for h in headings
          ]

          structure = re.sub(
              r"<(script|style)\b[^>]*>.*?</\1\s*>",
              "",
              html,
              flags=re.I | re.S
          )
          structure = re.sub(r"<!--.*?-->", "", structure, flags=re.S)

          prompt = f"""
          Ты — опытный frontend-разработчик и дизайнер интерфейсов.
          Нужно предложить конкретное, небольшое улучшение CSS
          существующего сайта «Штаб писателя».

          КОНЦЕПЦИЯ:
          «Контрастная мастерская»: выразительная тёмная верхняя
          область и/или боковая панель, если соответствующие элементы
          уже существуют; светлая рабочая область; светлые карточки.
          Палитра: угольный, бордовый, терракотовый, цвет старой бумаги,
          приглушённое золото. Заголовки с характером классической
          антиквы, интерфейсный текст легко читается.

          ВАЖНО:
          - Не выдумывай HTML-элементы и CSS-селекторы.
          - Используй только селекторы, подтверждённые исходным HTML/CSS.
          - Не меняй HTML, JavaScript, сетку, порядок блоков или логику.
          - Не делай весь сайт тёмным: рабочая область и карточки
            должны оставаться светлыми.
          - Не скрывай элементы и не удаляй содержимое.
          - Не добавляй новые функции, например PDF-экспорт.
          - Не используй @import, внешние ресурсы, сторонние библиотеки,
            !important или новые шрифты из сети.
          - Не повторяй существующие правила без причины.
          - Патч должен быть небольшим, самостоятельным и обратимым.
          - Не утверждай, что проверял сайт в браузере.
          - Если подходящего улучшения действительно нет, объясни
            конкретную причину. Но сначала изучи доступные правила
            и предложи улучшение, если оно обосновано.
          - Не включай рассуждения или текст вне требуемого JSON.

          ТЕКУЩИЙ CSS:
          {current_css[:14000]}

          КЛАССЫ, НАЙДЕННЫЕ В HTML:
          {json.dumps(classes, ensure_ascii=False)}

          ЗАГОЛОВКИ СТРАНИЦЫ:
          {json.dumps(headings[:80], ensure_ascii=False)}

          ФРАГМЕНТ СТРУКТУРЫ HTML:
          {structure[:9000]}

          Верни один JSON-объект строго такого вида:
          {{
            "status": "ready",
            "css": "здесь реальные CSS-правила",
            "report": "краткий отчёт на русском языке"
          }}

          Если безопасный патч объективно невозможен, верни:
          {{
            "status": "blocked",
            "css": "",
            "report": "конкретная причина и что требуется проверить"
          }}

          CSS должен быть обычным CSS, не Markdown и не блоком кода.
          Предпочтительный объём CSS — 500–2500 символов.
          Отчёт должен перечислить селекторы, изменения и риски.
          """

          endpoint = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account
              + "/ai/run/@cf/zai-org/glm-4.7-flash"
          )

          payload = {
              "messages": [
                  {
                      "role": "system",
                      "content": (
                          "Ты создаёшь проверяемые CSS-предложения. "
                          "Отвечай только корректным JSON-объектом. "
                          "Не изменяй исходный код."
                      )
                  },
                  {"role": "user", "content": prompt}
              ],
              "max_tokens": 3000,
              "temperature": 0.2,
              "chat_template_kwargs": {"enable_thinking": False}
          }

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=150) as response:
                  raw = response.read().decode("utf-8")
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              debug_path.write_text(
                  f"HTTP {exc.code}\n{detail[:5000]}",
                  encoding="utf-8"
              )
              fail(
                  f"Cloudflare AI вернул HTTP {exc.code}. "
                  "Подробности сохранены в диагностическом файле."
              )
          except Exception as exc:
              fail(f"Не удалось обратиться к Cloudflare AI: {exc}")

          try:
              envelope = json.loads(raw)
          except json.JSONDecodeError:
              debug_path.write_text(raw[:10000], encoding="utf-8")
              fail("Ответ Cloudflare не является корректным JSON.")

          if envelope.get("success") is False:
              debug_path.write_text(
                  json.dumps(envelope, ensure_ascii=False, indent=2)[:10000],
                  encoding="utf-8"
              )
              fail("Cloudflare сообщил об ошибке генерации.")

          result = envelope.get("result") or {}
          choices = result.get("choices") or []
          content = ""

          if choices:
              message = choices[0].get("message") or {}
              content = message.get("content") or ""

          if not content and isinstance(result.get("response"), str):
              content = result["response"]

          if not content.strip():
              debug_path.write_text(
                  json.dumps(envelope, ensure_ascii=False, indent=2)[:10000],
                  encoding="utf-8"
              )
              fail(
                  "Модель не вернула текст CSS-предложения. "
                  "Пустой результат не считается успехом."
              )

          content = content.strip()
          content = re.sub(r"^```(?:json)?\s*", "", content)
          content = re.sub(r"\s*```$", "", content)

          try:
              proposal = json.loads(content)
          except json.JSONDecodeError:
              debug_path.write_text(content[:10000], encoding="utf-8")
              fail(
                  "Модель вернула некорректный JSON. "
                  "Ответ сохранён для диагностики."
              )

          status = proposal.get("status")
          css = proposal.get("css", "")
          report = proposal.get("report", "")

          if not isinstance(report, str) or not report.strip():
              fail("В ответе модели отсутствует содержательный отчёт.")

          report_path.write_text(
              "# Предложение по дизайну «Штаба писателя»\n\n"
              "> Это предложение. Оно не применено к сайту.\n"
              "> Браузерная проверка не выполнялась.\n"
              "> Исходные файлы сайта не изменялись.\n\n"
              + report.strip()
              + "\n",
              encoding="utf-8"
          )

          if status == "blocked":
              css_path.write_text(
                  "/* CSS-патч не создан: см. отчёт. */\n",
                  encoding="utf-8"
              )
              print("BLOCKED: модель объяснила причину.")
              sys.exit(1)

          if status != "ready":
              fail("Неизвестный статус предложения от модели.")

          if not isinstance(css, str) or not css.strip():
              fail("Модель заявила готовность, но CSS пуст.")

          if len(css) > 12000:
              fail("CSS слишком большой для небольшого безопасного патча.")

          if not re.search(r"[^{}]+\{[^{}]*:[^{};]+;", css):
              fail("Не обнаружено ни одного полноценного CSS-правила.")

          if css.count("{") != css.count("}"):
              fail("В CSS не совпадает количество открывающих и закрывающих скобок.")

          if re.search(r"</?style\b|<script\b|javascript:|@import|!important", css, re.I):
              fail("CSS содержит запрещённые конструкции.")

          selectors = re.findall(r"([^{}]+)\{", css)
          known_classes = set()
          for group in classes:
              known_classes.update(group.split())

          known_ids = set(re.findall(
              r'\bid\s*=\s*["\']([^"\']+)["\']',
              html,
              flags=re.I
          ))

          for selector_group in selectors:
              for selector in selector_group.split(","):
                  selector = selector.strip()
                  if not selector:
                      fail("В CSS обнаружен пустой селектор.")

                  if selector.startswith("@"):
                      continue

                  for class_name in re.findall(r"\.([A-Za-z_][\w-]*)", selector):
                      if class_name not in known_classes:
                          fail(
                              "Селектор использует класс, которого нет "
                              f"в HTML: .{class_name}"
                          )

                  for element_id in re.findall(r"#([A-Za-z_][\w-]*)", selector):
                      if element_id not in known_ids:
                          fail(
                              "Селектор использует ID, которого нет "
                              f"в HTML: #{element_id}"
                          )

          css_path.write_text(
              "/* Предложение ИИ. Не применено к сайту. */\n\n"
              + css.strip()
              + "\n",
              encoding="utf-8"
          )

          print("CSS proposal generated.")
          print(f"CSS characters: {len(css)}")
          print(f"Known HTML classes: {len(known_classes)}")
          print("Source files were not modified.")
          PY

      - name: Upload proposal and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writers-hq-design-review
          path: design-output/
          if-no-files-found: warn
          retention-days: 7
