
name: AI Design Patch Proposal

on:
  workflow_dispatch:
  push:
    branches:
      - ai-agent-setup
    paths:
      - ".github/workflows/ai-design-patch.yml"

permissions:
  contents: read

jobs:
  propose-design:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate design proposal
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          from pathlib import Path

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("CLOUDFLARE_AI_TOKEN", "").strip()

          if not account or not token:
              sys.exit("ERROR: Cloudflare secrets are missing.")

          html_path = Path("index.html")
          if not html_path.is_file():
              sys.exit("ERROR: index.html was not found.")

          html = html_path.read_text(encoding="utf-8")

          css_parts = []
          for path in sorted(Path(".").rglob("*.css")):
              if any(part in {".git", "node_modules", ".venv"}
                     for part in path.parts):
                  continue
              css_parts.append(
                  f"\n/* {path.as_posix()} */\n"
                  + path.read_text(encoding="utf-8", errors="replace")
              )

          inline_css = re.findall(
              r"<style\b[^>]*>(.*?)</style\s*>",
              html,
              flags=re.I | re.S
          )
          for i, content in enumerate(inline_css, start=1):
              css_parts.append(f"\n/* Inline CSS {i} */\n{content}")

          css = "\n".join(css_parts)
          if not css.strip():
              sys.exit("ERROR: No CSS found in the repository.")

          headings = re.findall(
              r"<(h1|h2|h3)\b[^>]*>(.*?)</\1\s*>",
              html,
              flags=re.I | re.S
          )
          headings = [
              {
                  "tag": tag.lower(),
                  "text": re.sub(
                      r"\s+", " ",
                      re.sub(r"<[^>]+>", " ", content)
                  ).strip()[:80]
              }
              for tag, content in headings[:15]
          ]

          classes = sorted(set(
              cls
              for value in re.findall(
                  r'class=["\']([^"\']+)["\']', html
              )
              for cls in value.split()
          ))

          ids = sorted(set(re.findall(
              r'\bid=["\']([^"\']+)["\']', html
          )))

          context = {
              "headings": headings,
              "classes": classes[:100],
              "ids": ids[:80],
              "html_excerpt": html[:2500],
              "css_excerpt": css[:6500]
          }

          system_prompt = """
          Ты опытный UX/UI-дизайнер приложения «Штаб писателя».
          Отвечай по-русски и верни только корректный JSON без Markdown.

          ЗАДАЧА:
          Предложи конкретный, небольшой CSS-патч для дизайна
          «Контрастная мастерская». Нужны реальные визуальные улучшения,
          а не повторение описания существующего интерфейса.

          НАПРАВЛЕНИЕ:
          - Умеренная эстетика Возрождения.
          - Угольный, бордовый, терракотовый, старый пергамент,
            приглушённое золото.
          - Светлая рабочая область и светлые карточки.
          - Выразительные заголовки и удобочитаемый интерфейс.
          - Аккуратные границы, отступы, состояния наведения и фокуса.

          ПРАВИЛА:
          1. Сначала изучи переданные HTML и CSS.
          2. Предложи 2–5 конкретных CSS-правил, меняющих внешний вид.
          3. Используй только существующие и подтверждённые селекторы.
          4. Приоритет — верхняя зона, карточки, заголовки, кнопки,
             поля ввода и адаптивность, если соответствующие элементы
             действительно присутствуют в коде.
          5. Не превращай весь интерфейс в тёмную тему.
          6. Не меняй сетку, структуру страниц, функции, JavaScript,
             данные, авторизацию и навигацию.
          7. Не скрывай и не удаляй элементы.
          8. Не меняй глобальные переменные без анализа их применения.
          9. Не используй внешние шрифты, URL, импорты или платные сервисы.
          10. Не утверждай, что проверял сайт в браузере.
          11. Не выдавай предположения за обнаруженные дефекты.
          12. Если безопасное изменение невозможно обосновать,
              объясни это в implementation_stages. Не выдумывай селекторы.

          CSS_PATCH:
          - Это должен быть настоящий CSS, а не описание словами.
          - Патч должен содержать хотя бы одно CSS-правило.
          - Не более 1800 символов.
          - Используй только селекторы, подтверждённые входными данными.
          - Не добавляй HTML или JavaScript в CSS.

          Верни объект со всеми перечисленными ключами:
          {
            "css_patch": "CSS-код",
            "confirmed_findings": ["наблюдения по коду"],
            "needs_verification": ["что проверить вручную"],
            "accessibility_responsiveness": ["доступность и адаптивность"],
            "functional_roadmap": ["задачи вне CSS"],
            "html_candidates": ["кандидаты на отдельное согласование"],
            "implementation_stages": ["следующие шаги"]
          }

          Не более двух коротких пунктов в каждом списке.
          В отчёте отделяй подтверждённые факты от предположений.
          """

          prompt = (
              "Изучи код и подготовь CSS-патч по заданным требованиям. "
              "Не повторяй общие рекомендации вместо CSS. "
              "Не изменяй исходные файлы.\n\n"
              + json.dumps(context, ensure_ascii=False)
          )

          endpoint = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account
              + "/ai/run/@cf/zai-org/glm-4.7-flash"
          )

          payload = {
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": prompt}
              ],
              "max_tokens": 2600,
              "temperature": 0.1,
              "chat_template_kwargs": {
                  "enable_thinking": False
              }
          }

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Requesting CSS design proposal.")
          print("Thinking mode disabled.")
          print("Website source files will not be modified.")

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              sys.exit(
                  f"ERROR: Cloudflare request failed: "
                  f"{type(exc).__name__}: {exc}"
              )

          if not data.get("success"):
              print(json.dumps(
                  data.get("errors", []), ensure_ascii=False
              )[:1500])
              sys.exit("ERROR: Cloudflare returned an unsuccessful response.")

          result = data.get("result") or {}
          choices = result.get("choices") or []
          answer = ""
          finish = None

          if choices:
              choice = choices[0] or {}
              message = choice.get("message") or {}
              finish = choice.get("finish_reason")
              content = message.get("content")

              if isinstance(content, str):
                  answer = content.strip()
              elif isinstance(content, list):
                  answer = "\n".join(
                      item["text"]
                      for item in content
                      if isinstance(item, dict)
                      and isinstance(item.get("text"), str)
                  ).strip()

          if not answer and isinstance(result.get("response"), str):
              answer = result["response"].strip()

          print("Extracted response characters:", len(answer))
          print("Finish reason:", finish)
          print("Usage:", json.dumps(
              result.get("usage", {}), ensure_ascii=False
          )[:500])

          if not answer:
              sys.exit(
                  "ERROR: The model returned no readable text. "
                  "No proposal was accepted."
              )

          cleaned = re.sub(
              r"^```(?:json)?\s*", "", answer, flags=re.I
          )
          cleaned = re.sub(r"\s*```$", "", cleaned).strip()

          try:
              report = json.loads(cleaned)
          except json.JSONDecodeError as exc:
              print("Response preview:", cleaned[:1200])
              sys.exit(f"ERROR: Model returned invalid JSON: {exc}")

          required = [
              "css_patch",
              "confirmed_findings",
              "needs_verification",
              "accessibility_responsiveness",
              "functional_roadmap",
              "html_candidates",
              "implementation_stages"
          ]

          missing = [key for key in required if key not in report]
          if missing:
              sys.exit("ERROR: Missing report fields: " + ", ".join(missing))

          patch = report["css_patch"]
          if not isinstance(patch, str):
              sys.exit("ERROR: css_patch must be a string.")

          patch = patch.strip()

          if not patch:
              sys.exit(
                  "ERROR: The model returned an empty CSS patch. "
                  "The workflow will not mark this as successful. "
                  "Inspect the model response and revise the proposal."
              )

          if len(patch) > 2200:
              sys.exit("ERROR: CSS patch exceeds the permitted length.")

          if not re.search(r"[^{}]+\{[^{}]+\}", patch):
              sys.exit("ERROR: The response contains no recognizable CSS rule.")

          if re.search(
              r"<\s*/?\s*(?:script|html|body|iframe)\b|javascript\s*:",
              patch,
              flags=re.I
          ):
              sys.exit("ERROR: Unexpected markup found in CSS.")

          if re.search(r"@import\b|url\s*\(", patch, flags=re.I):
              sys.exit("ERROR: CSS imports and URLs are not allowed.")

          Path("design-proposal.css").write_text(
              "/* AI proposal only. Not applied to the website. */\n\n"
              + patch + "\n",
              encoding="utf-8"
          )

          titles = {
              "confirmed_findings": "Подтверждённые наблюдения",
              "needs_verification": "Что проверить вручную",
              "accessibility_responsiveness": "Доступность и адаптивность",
              "functional_roadmap": "Функциональные задачи вне CSS",
              "html_candidates": "Кандидаты на изменение HTML",
              "implementation_stages": "Следующие шаги"
          }

          lines = [
              "# Предложение по дизайну «Штаба писателя»",
              "",
              "> Предложение не применено к сайту.",
              "> Проверка в браузере не выполнялась.",
              "> Исходные файлы сайта не изменялись.",
              "",
              "## CSS",
              "",
              "Патч создан и сохранён отдельно для ручной проверки.",
              ""
          ]

          for key, title in titles.items():
              lines.extend(["## " + title, ""])
              items = report.get(key, [])

              if not isinstance(items, list) or not items:
                  lines.extend(["- Нет записей.", ""])
                  continue

              for item in items[:2]:
                  lines.append("- " + str(item))
              lines.append("")

          Path("design-review-report.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )

          print("CSS proposal generated and validated.")
          print("Website source files were not modified.")
          PY

      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: writers-hq-design-review
          path: |
            design-proposal.css
            design-review-report.md
          if-no-files-found: error
          retention-days: 7
