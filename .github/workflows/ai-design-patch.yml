
name: AI Design Patch Proposal

on:
  workflow_dispatch:
  push:
    branches:
      - ai-agent-setup
    paths:
      - ".github/workflows/ai-design-patch.yml"

permissions:
  contents: read

jobs:
  propose-design:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Analyze website and prepare proposals
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("CLOUDFLARE_AI_TOKEN", "").strip()

          if not account or not token:
              sys.exit(
                  "ERROR: Cloudflare secrets are missing. "
                  "Check CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_AI_TOKEN."
              )

          html_path = Path("index.html")
          if not html_path.is_file():
              sys.exit("ERROR: index.html was not found.")

          html = html_path.read_text(encoding="utf-8")

          css_parts = []
          for path in sorted(Path(".").rglob("*.css")):
              if any(
                  part in (".git", "node_modules", ".venv")
                  for part in path.parts
              ):
                  continue
              css_parts.append(
                  f"\n/* FILE: {path.as_posix()} */\n"
                  + path.read_text(encoding="utf-8", errors="replace")
              )

          inline_css = re.findall(
              r"<style\b[^>]*>(.*?)</style\s*>",
              html,
              flags=re.I | re.S
          )

          for number, css in enumerate(inline_css, 1):
              css_parts.append(
                  f"\n/* INLINE STYLE BLOCK {number} */\n{css}"
              )

          css = "\n".join(css_parts)

          if not css.strip():
              sys.exit("ERROR: No CSS was found.")

          headings = re.findall(
              r"<(h1|h2|h3)\b[^>]*>(.*?)</\1\s*>",
              html,
              flags=re.I | re.S
          )
          headings = [
              {
                  "tag": tag.lower(),
                  "text": re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", text)).strip()[:100]
              }
              for tag, text in headings[:35]
          ]

          buttons = re.findall(
              r"<button\b[^>]*>(.*?)</button\s*>",
              html,
              flags=re.I | re.S
          )
          buttons = [
              re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", item)).strip()[:80]
              for item in buttons[:35]
          ]

          classes = sorted(set(re.findall(
              r'class=["\']([^"\']+)["\']',
              html
          )))
          ids = sorted(set(re.findall(
              r'\bid=["\']([^"\']+)["\']',
              html
          )))

          summary = {
              "title": re.findall(
                  r"<title\b[^>]*>(.*?)</title\s*>",
                  html,
                  flags=re.I | re.S
              )[:1],
              "headings": headings,
              "buttons": buttons,
              "classes": classes[:100],
              "ids": ids[:100],
              "html_excerpt": html[:4500],
              "css_excerpt": css[:9000]
          }

          system_prompt = """
          Ты анализируешь HTML и CSS проекта «Штаб писателя».
          Отвечай на русском языке.

          ДИЗАЙН:
          «Контрастная мастерская»: тёмная боковая панель и верхняя зона,
          светлая рабочая область, цвета старого пергамента, угольный,
          бордовый, терракотовый и приглушённое золото.
          Книжная антиква для заголовков, читаемый системный шрифт интерфейса.
          Эстетика Возрождения — умеренно, без визуальной перегрузки.

          УЧТИ ПРЕДЫДУЩИЕ НАБЛЮДЕНИЯ:
          - Не меняй глобальный --bg вслепую.
          - Не скрывай .sub, пока не установлено, что именно этот элемент содержит.
          - Georgia — не обязательный выбор шрифта.
          - Проверь риски переполнения карточек и длинного текста.
          - Проверь доступность, контраст, подписи полей и видимый фокус.
          - Подтверждение опасных действий — отдельная функциональная задача.
          - Развитие разделов «Авторы» и сообщества — отдельная функциональная задача.
          - Визуализация книги и активности — возможные отдельные улучшения.
          - Большой приветственный заголовок, подпись под логотипом и цитата
            ранее рассматривались как кандидаты на удаление. Не удаляй их
            CSS-правилами: опиши их в отчёте для отдельного согласования.
          - Проверяй, существуют ли селекторы до их использования.

          ПРАВИЛА:
          - Ничего не изменяй в исходном сайте.
          - Не меняй HTML, JavaScript, функции, навигацию или данные.
          - Не скрывай элементы и не отключай управление.
          - Только осторожные CSS-переопределения.
          - Без внешних шрифтов, URL, платных сервисов и API.
          - Сохраняй адаптивность и клавиатурный фокус.
          - Не называй предположение подтверждённым дефектом.
          - Браузерная проверка не выполнялась.
          - Если безопасное CSS-изменение не очевидно, верни пустой патч.

          Верни только один JSON-объект со следующими ключами:
          {
            "css_patch": "CSS-код",
            "confirmed_findings": [],
            "needs_verification": [],
            "accessibility_responsiveness": [],
            "functional_roadmap": [],
            "html_candidates": [],
            "implementation_stages": []
          }

          В списках используй объекты с короткими полями:
          finding/evidence; check/reason; item/status/next_step;
          item/reason/css_scope; element_description/selector/caution;
          stage/action/validation соответственно.

          Верни корректный JSON без Markdown-ограждений.
          """

          endpoint = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account
              + "/ai/run/@cf/zai-org/glm-4.7-flash"
          )

          def extract_text(data):
              result = data.get("result") or {}

              if isinstance(result, dict):
                  response = result.get("response")
                  if isinstance(response, str) and response.strip():
                      return response

                  output_text = result.get("output_text")
                  if isinstance(output_text, str) and output_text.strip():
                      return output_text

                  choices = result.get("choices")
                  if isinstance(choices, list) and choices:
                      first = choices[0]
                      if isinstance(first, dict):
                          message = first.get("message") or {}
                          content = message.get("content")
                          if isinstance(content, str) and content.strip():
                              return content

                  output = result.get("output")
                  if isinstance(output, str) and output.strip():
                      return output

              return ""

          def call_model(prompt, max_tokens):
              payload = {
                  "messages": [
                      {
                          "role": "system",
                          "content": system_prompt
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "max_tokens": max_tokens,
                  "temperature": 0.1
              }

              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=180) as response:
                      raw = response.read().decode("utf-8")
                      data = json.loads(raw)
              except urllib.error.HTTPError as exc:
                  details = exc.read().decode("utf-8", errors="replace")
                  print(f"Cloudflare HTTP status: {exc.code}")
                  print(f"Cloudflare error response: {details[:1500]}")
                  return "", None
              except Exception as exc:
                  print(f"Cloudflare request error: {type(exc).__name__}: {exc}")
                  return "", None

              if not data.get("success"):
                  print(
                      "Cloudflare reported failure: "
                      + json.dumps(data.get("errors", []), ensure_ascii=False)[:1500]
                  )
                  return "", data

              result = data.get("result") or {}
              print("Cloudflare response keys:", list(result.keys()))
              print("Finish reason:", result.get("finish_reason", "not provided"))
              print("Usage:", json.dumps(
                  result.get("usage", {}),
                  ensure_ascii=False
              )[:500])

              return extract_text(data), data

          full_prompt = (
              "Проанализируй сайт и подготовь CSS-патч вместе с отчётом.\n\n"
              + json.dumps(summary, ensure_ascii=False)
          )

          print("Attempt 1: full design analysis.")
          answer, raw_data = call_model(full_prompt, 4500)

          if not answer.strip():
              print(
                  "Attempt 1 returned no text. "
                  "Retrying with a smaller prompt and output limit."
              )
              time.sleep(2)

              short_summary = {
                  "title": summary["title"],
                  "headings": summary["headings"][:18],
                  "buttons": summary["buttons"][:18],
                  "classes": summary["classes"][:45],
                  "ids": summary["ids"][:45],
                  "html_excerpt": html[:1800],
                  "css_excerpt": css[:3500]
              }

              short_prompt = (
                  "Подготовь компактный CSS-патч и краткий отчёт по тем же "
                  "правилам. Списки делай короткими, по 1-3 пункта. "
                  "Верни JSON с теми же семью ключами.\n\n"
                  + json.dumps(short_summary, ensure_ascii=False)
              )

              print("Attempt 2: compact design analysis.")
              answer, raw_data = call_model(short_prompt, 2800)

          if not answer.strip():
              sys.exit(
                  "ERROR: Cloudflare returned no usable model text after "
                  "two attempts. Review the diagnostic lines above, especially "
                  "the response keys, finish reason, usage, and any HTTP error. "
                  "No website files were modified."
              )

          answer = answer.strip()
          answer = re.sub(
              r"^```(?:json)?\s*",
              "",
              answer,
              flags=re.I
          )
          answer = re.sub(r"\s*```$", "", answer).strip()

          try:
              report = json.loads(answer)
          except json.JSONDecodeError as exc:
              print("Model output preview:", answer[:1200])
              sys.exit(
                  "ERROR: Model returned text, but it was not valid JSON. "
                  f"Parser details: {exc}. No website files were modified."
              )

          required = [
              "css_patch",
              "confirmed_findings",
              "needs_verification",
              "accessibility_responsiveness",
              "functional_roadmap",
              "html_candidates",
              "implementation_stages"
          ]

          missing = [key for key in required if key not in report]
          if missing:
              sys.exit(
                  "ERROR: Model output is missing fields: "
                  + ", ".join(missing)
              )

          patch = report.get("css_patch", "")
          if not isinstance(patch, str):
              sys.exit("ERROR: css_patch must be a string.")

          patch = patch.strip()

          if re.search(
              r"<\s*/?\s*(?:script|html|body|iframe)\b"
              r"|javascript\s*:",
              patch,
              flags=re.I
          ):
              sys.exit("ERROR: Unexpected markup in CSS proposal.")

          if re.search(r"@import\b|url\s*\(", patch, flags=re.I):
              sys.exit(
                  "ERROR: CSS proposal contains imports or URLs, "
                  "which are not allowed."
              )

          Path("design-proposal.css").write_text(
              "/* AI proposal only. Not applied to the website. */\n\n"
              + (patch + "\n" if patch else "/* No safe CSS changes proposed. */\n"),
              encoding="utf-8"
          )

          titles = [
              ("Наблюдения, подтверждённые исходным кодом", "confirmed_findings"),
              ("Что ещё нужно проверить", "needs_verification"),
              ("Доступность и адаптивность", "accessibility_responsiveness"),
              ("Функциональные задачи вне CSS", "functional_roadmap"),
              ("Кандидаты на отдельные изменения HTML", "html_candidates"),
              ("Этапы внедрения и проверки", "implementation_stages")
          ]

          lines = [
              "# Предложение по развитию дизайна «Штаба писателя»",
              "",
              "> Отчёт построен на исходном коде. Проверка в браузере не выполнялась.",
              "> Никакие изменения не применены.",
              "",
              "## Принципы оформления",
              "",
              "- Контрастная мастерская: тёмная боковая панель, светлая рабочая область.",
              "- Палитра старого пергамента, угольного, бордового, терракотового и золота.",
              "- Классические заголовки и читаемый шрифт интерфейса.",
              "- Сохранение функций, навигации, авторизации и данных.",
              "- Без автоматического изменения исходного сайта.",
              ""
          ]

          for title, key in titles:
              lines.extend(["## " + title, ""])
              items = report.get(key, [])

              if not isinstance(items, list) or not items:
                  lines.extend(["- Нет записей.", ""])
                  continue

              for item in items:
                  if isinstance(item, dict):
                      details = "; ".join(
                          f"**{name}:** {value}"
                          for name, value in item.items()
                      )
                      lines.append("- " + details)
                  else:
                      lines.append("- " + str(item))

              lines.append("")

          lines.extend([
              "## Важное ограничение",
              "",
              "CSS-патч — черновик. Его нужно проверить перед применением. "
              "Функциональные задачи не входят в этот патч.",
              ""
          ])

          Path("design-review-report.md").write_text(
              "\n".join(lines),
              encoding="utf-8"
          )

          print("Proposal and report created successfully.")
          print(f"CSS proposal length: {len(patch)} characters.")
          print("Original website files were not modified.")
          PY

      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: writers-hq-design-review
          path: |
            design-proposal.css
            design-review-report.md
          if-no-files-found: error
          retention-days: 7
