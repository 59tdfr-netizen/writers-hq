
name: AI Design Patch Proposal

on:
  workflow_dispatch:
  push:
    branches:
      - ai-agent-setup
    paths:
      - ".github/workflows/ai-design-patch.yml"

permissions:
  contents: read

jobs:
  propose-design:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate design proposal
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request
          from pathlib import Path

          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          token = os.environ.get("CLOUDFLARE_AI_TOKEN", "").strip()

          if not account or not token:
              sys.exit("ERROR: Cloudflare GitHub Secrets are missing.")

          html_path = Path("index.html")
          if not html_path.exists():
              sys.exit("ERROR: index.html was not found.")

          html = html_path.read_text(encoding="utf-8")

          css_parts = []
          for path in sorted(Path(".").rglob("*.css")):
              if any(part in {".git", "node_modules", ".venv"}
                     for part in path.parts):
                  continue
              css_parts.append(
                  f"\n/* {path.as_posix()} */\n"
                  + path.read_text(encoding="utf-8", errors="replace")
              )

          for i, content in enumerate(
              re.findall(
                  r"<style\b[^>]*>(.*?)</style\s*>",
                  html,
                  flags=re.I | re.S
              ),
              start=1
          ):
              css_parts.append(f"\n/* Inline CSS {i} */\n{content}")

          css = "\n".join(css_parts)
          if not css.strip():
              sys.exit("ERROR: No CSS was found.")

          headings = re.findall(
              r"<(h1|h2|h3)\b[^>]*>(.*?)</\1\s*>",
              html,
              flags=re.I | re.S
          )
          headings = [
              {
                  "tag": tag.lower(),
                  "text": re.sub(
                      r"\s+", " ",
                      re.sub(r"<[^>]+>", " ", content)
                  ).strip()[:70]
              }
              for tag, content in headings[:12]
          ]

          classes = sorted(set(re.findall(
              r'class=["\']([^"\']+)["\']', html
          )))
          ids = sorted(set(re.findall(
              r'\bid=["\']([^"\']+)["\']', html
          )))

          context = {
              "headings": headings,
              "classes": classes[:35],
              "ids": ids[:35],
              "html_excerpt": html[:1000],
              "css_excerpt": css[:2200]
          }

          system_prompt = """
          Ты UX/UI-дизайнер приложения «Штаб писателя». Пиши по-русски.
          Верни только один корректный JSON-объект, без Markdown и пояснений.

          Ключи:
          css_patch — строка с CSS;
          confirmed_findings — список;
          needs_verification — список;
          accessibility_responsiveness — список;
          functional_roadmap — список;
          html_candidates — список;
          implementation_stages — список.

          Не более 2 коротких пунктов в каждом списке.
          CSS-патч — не более 1800 символов.

          Дизайн: «Контрастная мастерская». Тёмная боковая навигация,
          светлая рабочая область, бумажные оттенки, угольный, бордовый,
          терракотовый и приглушённое золото. Заголовки — выразительная
          антиква, интерфейс — читаемый системный шрифт.

          ОБЯЗАТЕЛЬНО:
          - Сохраняй светлый фон рабочей области и карточек.
          - Не превращай весь интерфейс в тёмную тему.
          - Не меняй число колонок, размеры сетки и расположение блоков
            без подтверждения из кода.
          - Не меняй функции, JavaScript, данные, навигацию или авторизацию.
          - Не скрывай и не удаляй элементы.
          - Не используй неподтверждённые селекторы.
          - Не меняй глобальную переменную --bg вслепую.
          - Не скрывай .sub без изучения её содержимого.
          - Не используй внешние шрифты, URL, импорты или платные сервисы.
          - Не включай HTML или JavaScript в css_patch.
          - Кандидаты на удаление элементов — только в html_candidates,
            никаких CSS-правил для их скрытия.
          - Доступность: контраст, видимый фокус, адаптивность.
          - Функциональные идеи сообщества и подтверждения опасных действий
            перечисляй отдельно, не выдавай их за CSS-изменения.
          - Не утверждай, что проверял страницу в браузере.
          - Если безопасных CSS-изменений нет, верни пустую строку css_patch.
          """

          endpoint = (
              "https://api.cloudflare.com/client/v4/accounts/"
              + account
              + "/ai/run/@cf/zai-org/glm-4.7-flash"
          )

          prompt = (
              "Подготовь компактное предложение строго по схеме. "
              "Сохраняй светлую рабочую область. "
              "CSS не более 1800 символов. "
              "Не более двух коротких пунктов на список.\n\n"
              + json.dumps(context, ensure_ascii=False)
          )

          payload = {
              "messages": [
                  {"role": "system", "content": system_prompt},
                  {"role": "user", "content": prompt}
              ],
              "max_tokens": 2600,
              "temperature": 0.1,
              "chat_template_kwargs": {
                  "enable_thinking": False
              }
          }

          request = urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("Requesting compact design proposal.")
          print("Thinking mode disabled.")
          print("Maximum output tokens: 2600.")

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  data = json.loads(
                      response.read().decode("utf-8")
                  )
          except Exception as exc:
              print(f"Request failed: {type(exc).__name__}: {exc}")
              if hasattr(exc, "read"):
                  try:
                      print(exc.read().decode(
                          "utf-8", errors="replace"
                      )[:1000])
                  except Exception:
                      pass
              sys.exit("ERROR: Cloudflare request failed.")

          if not data.get("success"):
              print(json.dumps(
                  data.get("errors", []), ensure_ascii=False
              )[:1500])
              sys.exit("ERROR: Cloudflare returned an unsuccessful response.")

          result = data.get("result") or {}
          choices = result.get("choices") or []
          answer = ""
          finish = None

          if choices:
              choice = choices[0] or {}
              message = choice.get("message") or {}
              finish = choice.get("finish_reason")

              content = message.get("content")
              if isinstance(content, str):
                  answer = content.strip()
              elif isinstance(content, list):
                  answer = "\n".join(
                      item["text"]
                      for item in content
                      if isinstance(item, dict)
                      and isinstance(item.get("text"), str)
                  ).strip()

          if not answer and isinstance(result.get("response"), str):
              answer = result["response"].strip()

          print("Extracted text characters:", len(answer))
          print("Finish reason:", finish)
          print("Usage:", json.dumps(
              result.get("usage", {}), ensure_ascii=False
          )[:500])

          if not answer:
              if choices:
                  message = choices[0].get("message") or {}
                  print("Message keys:", list(message.keys()))
                  print(
                      "Content type:",
                      type(message.get("content")).__name__
                  )
              sys.exit(
                  "ERROR: No readable model text. "
                  "Website files were not modified."
              )

          cleaned = re.sub(
              r"^```(?:json)?\s*", "", answer, flags=re.I
          )
          cleaned = re.sub(r"\s*```$", "", cleaned).strip()

          try:
              report = json.loads(cleaned)
          except json.JSONDecodeError as exc:
              print("Output preview:", cleaned[:1800])
              if finish == "length":
                  sys.exit(
                      "ERROR: Model output was truncated. "
                      "Increase max_tokens or reduce the prompt."
                  )
              sys.exit(f"ERROR: Invalid JSON: {exc}")

          required = [
              "css_patch",
              "confirmed_findings",
              "needs_verification",
              "accessibility_responsiveness",
              "functional_roadmap",
              "html_candidates",
              "implementation_stages"
          ]

          missing = [key for key in required if key not in report]
          if missing:
              sys.exit("ERROR: Missing fields: " + ", ".join(missing))

          patch = report["css_patch"]
          if not isinstance(patch, str):
              sys.exit("ERROR: css_patch must be a string.")

          if len(patch) > 2200:
              sys.exit("ERROR: CSS proposal is longer than allowed.")

          if re.search(
              r"<\s*/?\s*(?:script|html|body|iframe)\b|javascript\s*:",
              patch,
              flags=re.I
          ):
              sys.exit("ERROR: Unexpected markup in CSS proposal.")

          if re.search(r"@import\b|url\s*\(", patch, flags=re.I):
              sys.exit("ERROR: CSS imports and URLs are not allowed.")

          Path("design-proposal.css").write_text(
              "/* AI proposal only. Not applied to the website. */\n\n"
              + (
                  patch.strip() + "\n"
                  if patch.strip()
                  else "/* No safe CSS changes proposed. */\n"
              ),
              encoding="utf-8"
          )

          titles = {
              "confirmed_findings": "Подтверждённые наблюдения",
              "needs_verification": "Что проверить вручную",
              "accessibility_responsiveness": "Доступность и адаптивность",
              "functional_roadmap": "Функциональные задачи вне CSS",
              "html_candidates": "Кандидаты на изменение HTML",
              "implementation_stages": "Следующие шаги"
          }

          lines = [
              "# Предложение по дизайну «Штаба писателя»",
              "",
              "> Предложение не применено к сайту.",
              "> Проверка в браузере не выполнялась.",
              "> Исходные файлы сайта не изменялись.",
              ""
          ]

          for key, title in titles.items():
              lines.extend(["## " + title, ""])
              items = report.get(key, [])
              if not isinstance(items, list) or not items:
                  lines.extend(["- Нет записей.", ""])
                  continue
              for item in items[:2]:
                  lines.append("- " + str(item))
              lines.append("")

          lines.extend([
              "## CSS",
              "",
              "CSS-патч находится в отдельном файле design-proposal.css.",
              "Его необходимо проверить перед применением.",
              ""
          ])

          Path("design-review-report.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )

          print("Proposal generated successfully.")
          print("Website source files were not modified.")
          PY

      - name: Upload review files
        uses: actions/upload-artifact@v4
        with:
          name: writers-hq-design-review
          path: |
            design-proposal.css
            design-review-report.md
          if-no-files-found: error
          retention-days: 7
