name: Site checks

on:
  pull_request:
    paths:
      - "index.html"
      - "assets/**"
      - "tests/check_site.py"
      - "tests/test_collect_literary_opportunities.py"
      - "scripts/**"
      - "tests/check_workflows.py"
      - "supabase/migrations/**"
      - ".github/workflows/database-backup.yml"
      - ".github/workflows/site-checks.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "tests/check_site.py"
      - "tests/check_workflows.py"
      - ".github/workflows/database-backup.yml"
      - "supabase/migrations/**"
      - ".github/workflows/site-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate HTML metadata, favicon and inline JavaScript syntax
        run: python tests/check_site.py
      - name: Install scraper test dependency
        run: python -m pip install beautifulsoup4
      - name: Run collector unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate backup workflow safety settings
        run: python tests/check_workflows.py
